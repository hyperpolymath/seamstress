[tools]
# Language runtimes
rust = "latest"
zig = "latest"
bun = "1.4"

# Package managers
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Tool-version aliases only ([alias] cannot hold commands)
[alias]
task = "go-task"

[tasks.build]
dir = "tools/seamctl"
run = "cargo build --release"

[tasks.test]
dir = "tools/seamctl"
run = "cargo test"

[tasks.lint]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --check ."

[tasks.fmt]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --write ."
